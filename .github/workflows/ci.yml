name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag (no "v10"): full version required.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --group ha-tests
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest

  # Added together with custom_components/eilwacht (they fail without it):
  # hassfest, hacs/action and the compat job for the oldest promised HA version,
  # as in Streckenwacht.
