blueprint:
  name: >-
    Eilwacht – Neue Meldung eines Nachrichtenwächters aufs Handy /
    New item of a news watch to the phone
  description: >-
    Schickt jede neue Meldung eines Eilwacht-Nachrichtenwächters (Bundesland,
    Stichworte) als Push-Nachricht an ein Handy mit der Home-Assistant-App.
    Der Titel nennt die Dachzeile oder das gefundene Stichwort, bei mehreren
    Wächtern auch den Wächter. Ein Tippen öffnet den Artikel. Während der
    Ruhezeit kommt keine Nachricht. Unter „Weitere Aktionen“ lässt sich die
    Meldung zusätzlich oder statt aufs Handy weiterschicken, etwa per Telegram.
    ---
    Sends every new item of an Eilwacht news watch (federal state, keywords)
    as a push notification to a phone with the Home Assistant app. The title
    names the topline or the keyword found, and the watch if there is more
    than one. A tap opens the article. Nothing is sent during the quiet hours.
    Under “More actions” the item can also be passed on, with or without the
    phone, for example via Telegram. The news itself is
    in German, as tagesschau.de publishes it.
  domain: automation
  author: Eilwacht
  homeassistant:
    min_version: "2026.3.0"
  source_url: https://github.com/eilwacht/integration/blob/main/blueprints/automation/eilwacht/neue_meldung_push.yaml
  input:
    event_entity:
      name: Neue Meldung / New item
      description: >-
        Die Entität „Neue Meldung“ des Nachrichtenwächters. /
        The entity “New item” of the news watch.
      selector:
        entity:
          filter:
            integration: eilwacht
            domain: event
    notify_device:
      name: Handy (optional) / Phone (optional)
      description: >-
        Gerät mit der offiziellen Home-Assistant-App. Leer lassen, wenn die
        Meldung nur über „Weitere Aktionen“ gehen soll. /
        Device with the official Home Assistant app. Leave empty to pass the
        news on only via “More actions”.
      default: ""
      selector:
        device:
          filter:
            integration: mobile_app
    language:
      name: Sprache der Nachricht / Language of the message
      description: >-
        Für den Titel der Nachricht. Die Meldung selbst kommt so, wie die
        Tagesschau sie schreibt (deutsch). /
        For the title of the notification. The news itself stays as the
        Tagesschau writes it (German).
      default: de
      selector:
        select:
          options:
            - label: Deutsch
              value: de
            - label: English
              value: en
    quiet_enabled:
      name: Ruhezeit verwenden / Use quiet hours
      default: true
      selector:
        boolean: {}
    quiet_start:
      name: Ruhezeit ab / Quiet hours from
      default: "22:00:00"
      selector:
        time: {}
    quiet_end:
      name: Ruhezeit bis / Quiet hours until
      default: "07:00:00"
      selector:
        time: {}
    more:
      name: Weitere Aktionen (optional) / More actions (optional)
      icon: mdi:playlist-plus
      collapsed: true
      input:
        extra_actions:
          name: Weitere Aktionen / More actions
          description: >-
            Laufen nach der Push-Nachricht mit dem fertigen Text. Nutzbar sind
            `{{ title }}`, `{{ message }}` und `{{ url }}` (Link zum Artikel).
            Beispiel Telegram: Aktion `telegram_bot.send_message` mit
            `message: "{{ title }}: {{ message }}"`. /
            Run after the push notification with the finished text. Available
            are `{{ title }}`, `{{ message }}` and `{{ url }}` (link to the
            article). Example Telegram: action `telegram_bot.send_message` with
            `message: "{{ title }}: {{ message }}"`.
          default: []
          selector:
            action: {}

# Several items can arrive in one update: send each of them.
mode: queued
max: 20

triggers:
  - trigger: state
    entity_id: !input event_entity

variables:
  notify_device: !input notify_device
  quiet_enabled: !input quiet_enabled
  lang: !input language
  # The phone's notify action: mobile_app names it after the registered device.
  # No phone chosen (or the device is gone): nothing is sent to a phone.
  phone_action: >-
    {%- set d = device_attr(notify_device, 'name') if notify_device else none -%}
    {{ 'notify.mobile_app_' ~ (d | slugify) if d else '' }}
  # After a restart or an outage the entity shows its last event again: only a
  # change from a real previous state is a new event.
  is_new: >-
    {{ trigger.from_state is not none and trigger.to_state is not none
       and trigger.from_state.state != 'unavailable'
       and trigger.to_state.state not in ['unavailable', 'unknown']
       and trigger.to_state.state != trigger.from_state.state
       and trigger.to_state.attributes.get('event_type') == 'news' }}
  headline: "{{ trigger.to_state.attributes.get('title', '') if trigger.to_state else '' }}"
  heading: >-
    {%- set a = trigger.to_state.attributes if trigger.to_state else {} %}
    {{- a.get('topline') or ((a.get('keywords') or []) | join(', '))
        or ('New item' if lang == 'en' else 'Neue Meldung') -}}
  # Number of news watches: each has exactly one event entity with the event
  # type "news" (the breaking news device has "breaking_news"), on a device of
  # its own. Counted by device, so a renamed entity still counts once.
  watches: >-
    {{ integration_entities('eilwacht')
       | select('is_state_attr', 'event_types', ['news'])
       | map('device_id') | reject('none') | unique | list | count }}
  # The watch, only if there is more than one: its device is called
  # "Eilwacht <name>" (or what the user renamed it to). Otherwise, or without
  # a device, only "Eilwacht" is shown.
  watch: >-
    {%- set d = device_id(trigger.entity_id) if watches | int(0) > 1 else none -%}
    {%- set n = (device_attr(d, 'name_by_user') or device_attr(d, 'name') or '') if d else '' -%}
    {{- n[9:] if n.startswith('Eilwacht ') else n -}}
  url: "{{ trigger.to_state.attributes.get('url') or '' if trigger.to_state else '' }}"
  # The finished texts, also for the extra actions.
  title: >-
    {{- 'Eilwacht' ~ (' · ' ~ watch if watch else '')
        ~ (': ' ~ heading if heading | lower != watch | lower else '') -}}
  message: "{{ headline }}"

conditions:
  - condition: template
    value_template: "{{ is_new }}"
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ not quiet_enabled }}"
      - condition: not
        conditions:
          - condition: time
            after: !input quiet_start
            before: !input quiet_end

actions:
  - alias: Push-Nachricht an das Handy
    if:
      - condition: template
        value_template: "{{ phone_action != '' }}"
    then:
      - action: "{{ phone_action }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
          data:
            group: eilwacht
            url: "{{ url }}"
            clickAction: "{{ url }}"
  - alias: Weitere Aktionen
    sequence: !input extra_actions
