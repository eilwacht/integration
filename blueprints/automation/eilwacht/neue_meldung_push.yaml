blueprint:
  name: >-
    Eilwacht – Neue Meldung eines Nachrichtenwächters aufs Handy /
    New item of a news watch to the phone
  description: >-
    Schickt jede neue Meldung eines Eilwacht-Nachrichtenwächters (Bundesland,
    Stichworte) als Push-Nachricht an ein Handy mit der Home-Assistant-App.
    Der Titel nennt den Wächter und die Dachzeile oder das gefundene Stichwort.
    Ein Tippen öffnet den Artikel. Während der Ruhezeit kommt keine Nachricht.
    Unter „Weitere Aktionen“ lässt sich die Meldung zusätzlich weiterschicken,
    etwa per Telegram.
    ---
    Sends every new item of an Eilwacht news watch (federal state, keywords)
    as a push notification to a phone with the Home Assistant app. The title
    names the watch and the topline or the keyword found. A tap opens the
    article. Nothing is sent during the quiet hours. Under “More actions” the
    item can also be passed on, for example via Telegram. The news itself is
    in German, as tagesschau.de publishes it.
  domain: automation
  author: Eilwacht
  homeassistant:
    min_version: "2026.3.0"
  source_url: https://github.com/eilwacht/integration/blob/main/blueprints/automation/eilwacht/neue_meldung_push.yaml
  input:
    event_entity:
      name: Neue Meldung / New item
      description: >-
        Die Entität „Neue Meldung“ des Nachrichtenwächters. /
        The entity “New item” of the news watch.
      selector:
        entity:
          filter:
            integration: eilwacht
            domain: event
    notify_device:
      name: Handy / Phone
      description: >-
        Gerät mit der offiziellen Home-Assistant-App. /
        Device with the official Home Assistant app.
      selector:
        device:
          filter:
            integration: mobile_app
    language:
      name: Sprache der Nachricht / Language of the message
      description: >-
        Für den Titel der Nachricht. Die Meldung selbst kommt so, wie die
        Tagesschau sie schreibt (deutsch). /
        For the title of the notification. The news itself stays as the
        Tagesschau writes it (German).
      default: de
      selector:
        select:
          options:
            - label: Deutsch
              value: de
            - label: English
              value: en
    quiet_enabled:
      name: Ruhezeit verwenden / Use quiet hours
      default: true
      selector:
        boolean: {}
    quiet_start:
      name: Ruhezeit ab / Quiet hours from
      default: "22:00:00"
      selector:
        time: {}
    quiet_end:
      name: Ruhezeit bis / Quiet hours until
      default: "07:00:00"
      selector:
        time: {}
    more:
      name: Weitere Aktionen (optional) / More actions (optional)
      icon: mdi:playlist-plus
      collapsed: true
      input:
        extra_actions:
          name: Weitere Aktionen / More actions
          description: >-
            Laufen nach der Push-Nachricht mit dem fertigen Text. Nutzbar sind
            `{{ title }}`, `{{ message }}` und `{{ url }}` (Link zum Artikel).
            Beispiel Telegram: Aktion `telegram_bot.send_message` mit
            `message: "{{ title }}: {{ message }}"`. /
            Run after the push notification with the finished text. Available
            are `{{ title }}`, `{{ message }}` and `{{ url }}` (link to the
            article). Example Telegram: action `telegram_bot.send_message` with
            `message: "{{ title }}: {{ message }}"`.
          default: []
          selector:
            action: {}

# Several items can arrive in one update: send each of them.
mode: queued
max: 20

triggers:
  - trigger: state
    entity_id: !input event_entity

variables:
  quiet_enabled: !input quiet_enabled
  lang: !input language
  # After a restart or an outage the entity shows its last event again: only a
  # change from a real previous state is a new event.
  is_new: >-
    {{ trigger.from_state is not none and trigger.to_state is not none
       and trigger.from_state.state != 'unavailable'
       and trigger.to_state.state not in ['unavailable', 'unknown']
       and trigger.to_state.state != trigger.from_state.state
       and trigger.to_state.attributes.get('event_type') == 'news' }}
  headline: "{{ trigger.to_state.attributes.get('title', '') if trigger.to_state else '' }}"
  heading: >-
    {%- set a = trigger.to_state.attributes if trigger.to_state else {} %}
    {{- a.get('topline') or ((a.get('keywords') or []) | join(', '))
        or ('New item' if lang == 'en' else 'Neue Meldung') -}}
  # The watch: its device is called "Eilwacht <name>" (or what the user renamed
  # it to). Without a device only "Eilwacht" is shown.
  watch: >-
    {%- set d = device_id(trigger.entity_id) -%}
    {%- set n = (device_attr(d, 'name_by_user') or device_attr(d, 'name') or '') if d else '' -%}
    {{- n[9:] if n.startswith('Eilwacht ') else n -}}
  url: "{{ trigger.to_state.attributes.get('url') or '' if trigger.to_state else '' }}"
  # The finished texts, also for the extra actions.
  title: >-
    {{- 'Eilwacht' ~ (' · ' ~ watch if watch else '')
        ~ (': ' ~ heading if heading | lower != watch | lower else '') -}}
  message: "{{ headline }}"

conditions:
  - condition: template
    value_template: "{{ is_new }}"
  - condition: or
    conditions:
      - condition: template
        value_template: "{{ not quiet_enabled }}"
      - condition: not
        conditions:
          - condition: time
            after: !input quiet_start
            before: !input quiet_end

actions:
  - alias: Push-Nachricht an das Handy
    domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "{{ title }}"
    message: "{{ message }}"
    data:
      group: eilwacht
      url: "{{ url }}"
      clickAction: "{{ url }}"
  - alias: Weitere Aktionen
    sequence: !input extra_actions
